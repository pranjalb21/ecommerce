<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart — VOLTCORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <div class="header-top">
      <button class="icon-btn" aria-label="Menu">&#9776;</button>
      <a href="index.html" class="logo">VOLT<span>CORE</span></a>
      <div class="search-bar">
        <span class="icon">&#128269;</span>
        <input type="text" placeholder="Search parts..." aria-label="Search">
      </div>
      <div class="header-actions">
        <button class="icon-btn" aria-label="Search">&#128269;</button>
        <a href="#" class="icon-btn" aria-label="Account">&#128100;</a>
        <a href="cart.html" class="icon-btn" aria-label="Cart">&#128717;<span class="cart-count">3</span></a>
      </div>
    </div>
    <nav class="header-nav">
      <a href="shop.html">Resistors</a><a href="shop.html">Capacitors</a><a href="shop.html">Connectors</a><a href="shop.html">Microcontrollers</a><a href="shop.html">Sensors</a><a href="shop.html">Switches</a><a href="shop.html">All Categories</a>
    </nav>
  </div>
</header>

<div class="container">
  <h2 class="h1" style="margin:var(--sp-5) 0 var(--sp-2);">Your Cart</h2>
  <p class="muted small" style="margin-bottom:var(--sp-4);">3 items</p>
</div>

<section>
  <div class="container">
    <div class="cart-layout">
      <div id="cart-items-container"></div>
      <aside class="order-summary">
        <h2>Order Summary</h2>
        <div class="summary-row"><span>Subtotal</span><span id="cart-subtotal">$0.00</span></div>
        <div class="summary-row"><span>Shipping</span><span>Free over $25</span></div>
        <div class="summary-row"><span>Tax</span><span>Calculated at checkout</span></div>
        <div class="promo">
          <input type="text" placeholder="Promo code" data-promo-input>
          <button class="btn btn-secondary btn-sm" data-promo>Apply</button>
        </div>
        <div class="summary-row total"><span>Total</span><span id="cart-total">$0.00</span></div>
        <a href="checkout.html" class="btn btn-primary" style="width:100%;margin-top:var(--sp-4);">Proceed to Checkout</a>
        <p class="small muted" style="text-align:center;margin-top:var(--sp-2);">Secure checkout · SSL encrypted</p>
      </aside>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom"><span>&copy; 2026 Voltcore.</span><span>Privacy &middot; Terms &middot; Cookies</span></div>
  </div>
</footer>

<script src="app.js"></script>
</body>
</html>
