<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — VOLTCORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <div class="header-top">
      <a href="index.html" class="logo">VOLT<span>CORE</span></a>
      <div class="header-actions">
        <a href="cart.html" class="icon-btn" aria-label="Cart">&#128717;<span class="cart-count">3</span></a>
      </div>
    </div>
  </div>
</header>

<section style="padding: var(--sp-5) 0;">
  <div class="container" style="max-width:1000px;">
    <h2 class="h1" style="margin-bottom:var(--sp-4);">Checkout</h2>
    <div class="checkout-steps">
      <span class="active">1. Information</span>
      <span>2. Shipping</span>
      <span>3. Payment</span>
      <span>4. Review</span>
    </div>
    <div style="display:grid;grid-template-columns:1fr 340px;gap:var(--sp-5);">
      <form id="checkout-form">
        <div style="background:#fff;border:1px solid var(--color-border-subtle);border-radius:var(--radius-md);padding:var(--sp-4);margin-bottom:var(--sp-4);">
          <h3 style="font-family:var(--font-display);font-size:var(--fs-h3);margin-bottom:var(--sp-3);">Contact Information</h3>
          <input type="email" placeholder="Email address" required style="width:100%;padding:8px 10px;border:1px solid var(--color-border-strong);border-radius:var(--radius-sm);font-size:var(--fs-body);margin-bottom:var(--sp-3);">
          <label style="font-size:var(--fs-body-s);display:flex;align-items:center;gap:var(--sp-2);"><input type="checkbox"> Email me with news and offers</label>
        </div>
        <div style="background:#fff;border:1px solid var(--color-border-subtle);border-radius:var(--radius-md);padding:var(--sp-4);margin-bottom:var(--sp-4);">
          <h3 style="font-family:var(--font-display);font-size:var(--fs-h3);margin-bottom:var(--sp-3);">Shipping Address</h3>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2);margin-bottom:var(--sp-2);">
            <input type="text" placeholder="First name" required style="padding:8px 10px;border:1px solid var(--color-border-strong);border-radius:var(--radius-sm);font-size:var(--fs-body);">
            <input type="text" placeholder="Last name" required style="padding:8px 10px;border:1px solid var(--color-border-strong);border-radius:var(--radius-sm);font-size:var(--fs-body);">
          </div>
          <input type="text" placeholder="Address" required style="width:100%;padding:8px 10px;border:1px solid var(--color-border-strong);border-radius:var(--radius-sm);font-size:var(--fs-body);margin-bottom:var(--sp-2);">
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--sp-2);margin-bottom:var(--sp-2);">
            <input type="text" placeholder="City" required style="padding:8px 10px;border:1px solid var(--color-border-strong);border-radius:var(--radius-sm);font-size:var(--fs-body);">
            <input type="text" placeholder="ZIP / Postal" required style="padding:8px 10px;border:1px solid var(--color-border-strong);border-radius:var(--radius-sm);font-size:var(--fs-body);">
            <input type="text" placeholder="Country" required style="padding:8px 10px;border:1px solid var(--color-border-strong);border-radius:var(--radius-sm);font-size:var(--fs-body);">
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">Place Order</button>
      </form>
      <aside class="order-summary">
        <h2>Order Summary</h2>
        <div class="summary-row"><span>Subtotal</span><span id="cart-subtotal">$0.00</span></div>
        <div class="summary-row"><span>Shipping</span><span>Free over $25</span></div>
        <div class="summary-row"><span>Tax</span><span>Calculated at checkout</span></div>
        <div class="summary-row total"><span>Total</span><span id="cart-total">$0.00</span></div>
      </aside>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom"><span>&copy; 2026 Voltcore.</span><span>Privacy &middot; Terms &middot; Cookies</span></div>
  </div>
</footer>

<script src="app.js"></script>
<script>
  document.getElementById('checkout-form').addEventListener('submit', function(e){
    e.preventDefault();
    localStorage.removeItem('volt_cart');
    window.Volt.showToast('Order placed. Thank you!', 'success');
    setTimeout(function(){ window.location.href = 'index.html'; }, 1800);
  });
</script>
</body>
</html>
